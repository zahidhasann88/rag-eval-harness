name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing
      - name: Evaluate example dataset
        run: |
          rag-eval validate --dataset examples/dataset.jsonl --corpus examples/corpus.jsonl --strict
          rag-eval run --dataset examples/dataset.jsonl --corpus examples/corpus.jsonl --pipeline tfidf --report out/report.json --report out/report.html
